name: Update GitHub dashboard cards

on:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&hide_border=false&include_all_commits=true&rank_icon=github&card_width=345
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Expand stats SVG viewport
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("profile/stats.svg")
          svg = path.read_text(encoding="utf-8")

          svg, n1 = re.subn(r'width="345"', 'width="355"', svg, count=1)
          svg, n2 = re.subn(r'viewBox="0 0 345 195"', 'viewBox="0 0 355 195"', svg, count=1)
          svg, n3 = re.subn(r'(data-testid="card-bg"[\s\S]*?width=")344("[\s\S]*?/>)', r'\g<1>354\2', svg, count=1)

          if (n1, n2, n3) != (1, 1, 1):
              raise RuntimeError(f"Unexpected stats.svg structure: width={n1}, viewBox={n2}, bg={n3}")

          path.write_text(svg, encoding="utf-8")

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=345&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Motor Control Deck card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Motor-Control-Deck&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-motor-control-deck.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate CYD Mini TV card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=CYD-2.8Inch-Mini-Tivi&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-cyd-mini-tv.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate STM32 FreeRTOS card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=STM32-FreeRTOS-Multi-Task-Demo&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-stm32-freertos.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Do Line card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Do_Line&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-do-line.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Robot DHTD18A2HN card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Robot_DHTD18A2HN_2025&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-robot-dhtd18a2hn-2025.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Altium Library card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Altium_Library&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-altium-library.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Codex Plugin Bridge card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Codex-Plugin-Bridge&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-codex-plugin-bridge.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate TranslateDub card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=TranslateDub&bg_color=0D1B2A&title_color=79E4DC&text_color=D9E9F2&icon_color=79E4DC&border_color=2D465B&border_radius=12&disable_animations=true&description_lines_count=2
          path: profile/pin-translatedub.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh README cards"
          git push
